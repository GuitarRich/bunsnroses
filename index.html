<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link href="./app.css" rel="stylesheet">

<div id="sv">
  <header><div class="wrap plate">
    <div class="lamp"></div>
    <h1 class="disp">Bun's &amp; Roses<small>Setlist Vote &middot; <span id="ver"></span></small></h1>
    <div class="status" id="status">Checking</div>
  </div></header>

  <div class="wrap">
    <div id="banner" class="banner hide"></div>

    <div id="gate" class="gate">
      <div class="eyebrow">Step one</div>
      <h2 class="disp">Who's voting?</h2>
      <p class="note" id="gateNote"></p>
      <div class="names" id="names"></div>
      <input id="nameIn" placeholder="Or type your name" maxlength="18" autocomplete="off">
      <input id="secretIn" placeholder="Access code" type="password" autocomplete="off" style="margin-top:8px">
      <p class="note" style="margin-top:8px">Same value as <b>APP_SECRET</b> in Vercel. Clicking a name will not skip this.</p>
      <button class="go disp" id="start">Start voting</button>
      <p class="note" id="verNote" style="margin-top:11px"></p>
      <div id="gateErr" class="err hide"></div>
    </div>

    <div id="vote" class="hide">
      <div class="bar"><i id="pbar" style="width:0"></i></div>
      <div class="prog"><span id="pcount" class="mono"></span><span id="pleft" class="mono"></span></div>
      <div class="track" id="tcard">
        <div class="tnum mono"><span id="tnum"></span><b id="tvote"></b></div>
        <div class="tname disp" id="tname"></div>
        <div class="tart" id="tart"></div>
        <div class="tmeta mono"><span id="tdur"></span><span id="tyear"></span><span id="tbpm"></span><span id="tera"></span><span id="ttune"></span></div>
      </div>
      <div class="votes" id="votes">
        <button data-v="3"><b>Must play</b><span>Fight me on it</span></button>
        <button data-v="2"><b>Yes</b><span>Happy to play it</span></button>
        <button data-v="1"><b>Maybe</b><span>If it fits</span></button>
        <button data-v="0"><b>Pass</b><span>Leave it off &mdash; outweighs two Yes votes</span></button>
      </div>
      <div class="steps">
        <button id="prev">&larr; Previous</button>
        <button id="next">Skip &rarr;</button>
      </div>
      <div class="util">
        <button id="jump">Next unscored</button>
        <button id="clearv">Clear this vote</button>
        <a class="btn ghost" href="./results.html" style="text-decoration:none;padding:8px 12px">Setlist &amp; standings &rarr;</a>
      </div>
    </div>
  </div>
</div>

<script type="module">
import { VERSION, CHANGES, LABEL } from "./catalog.js";
import { TARGET_SONGS, MAX_PER_ARTIST, eraLabel, tuningFor, mmss } from "./setlist.js";
import { S, BAND, onStatus, pull, persist, relist } from "./store.js";

const $ = (id) => document.getElementById(id);
let idx = 0;
const tuneOf = (r) => tuningFor(S.tunings, r.name, r.artist);

/* ---------- connection banner ---------- */
function setStatus() {
  const el = $("status");
  if (S.storageOK === null) { el.textContent = "Checking"; el.className = "status"; return; }
  if (S.storageOK) {
    el.textContent = "Saved"; el.className = "status ok"; $("banner").classList.add("hide");
  } else if (/wrong access code/i.test(S.lastErr || "")) {
    el.textContent = "Wrong code"; el.className = "status warn";
    $("banner").innerHTML = "<b>Wrong access code.</b> Type the exact <b>APP_SECRET</b> from Vercel, then tap Start.";
    $("banner").classList.remove("hide");
  } else {
    el.textContent = "Not saving"; el.className = "status warn";
    $("banner").innerHTML = "<b>Not reaching the server" + (S.lastErr ? " — " + S.lastErr : "") +
      ".</b> Your votes are safe in this tab but won't sync. Check your connection, or open the setlist page and tap <b>Copy my code</b> so nothing is lost.";
    $("banner").classList.remove("hide");
  }
}
onStatus(setStatus);
function toast(msg) {
  const b = $("banner"); b.innerHTML = msg; b.classList.remove("hide"); setTimeout(setStatus, 7000);
}

/* ---------- gate ---------- */
$("gateNote").innerHTML = S.list.length + " songs, and one set of about " + TARGET_SONGS +
  " on the night. Score what you have an opinion on, skip the rest, change your mind whenever. " +
  "Pass is a veto: it outweighs two Yes votes. At most " + MAX_PER_ARTIST + " song per artist makes the set.";

BAND.forEach((n) => {
  const b = document.createElement("button");
  b.textContent = n;
  b.onclick = () => { $("nameIn").value = n; begin(); };
  $("names").appendChild(b);
});
$("start").onclick = begin;
$("nameIn").addEventListener("keydown", (e) => { if (e.key === "Enter") begin(); });
$("secretIn").addEventListener("keydown", (e) => { if (e.key === "Enter") begin(); });

async function begin() {
  const n = $("nameIn").value.trim();
  S.secret = $("secretIn").value.trim();
  try {
    if (S.secret) localStorage.setItem("br_secret", S.secret);
    if (n) localStorage.setItem("br_name", n);
  } catch (e) {}
  if (!n) { $("gateErr").textContent = "Type a name so your votes can be told apart."; $("gateErr").classList.remove("hide"); return; }
  if (!S.secret) {
    $("gateErr").textContent = "Enter the access code (APP_SECRET in Vercel), then tap Start.";
    $("gateErr").classList.remove("hide"); $("secretIn").focus(); return;
  }
  S.me = n;
  $("gateErr").classList.add("hide");
  $("gate").classList.add("hide"); $("vote").classList.remove("hide");
  await pull();
  S.pool[S.me] = S.myVotes;
  const found = Object.keys(S.myVotes).length;
  const u = firstUnscored();
  idx = u < 0 ? 0 : u;
  render();
  const saved = await persist();
  if (!saved && /wrong access code/i.test(S.lastErr || "")) {
    $("vote").classList.add("hide"); $("gate").classList.remove("hide");
    $("gateErr").textContent = "Wrong access code. Use the exact APP_SECRET value from Vercel.";
    $("gateErr").classList.remove("hide"); $("secretIn").focus(); $("secretIn").select();
    return;
  }
  if (found) toast("Picked up where you left off — <b>" + found + "</b> of " + S.list.length + " already scored.");
}

/* ---------- voting ---------- */
const firstUnscored = () => S.list.findIndex((s) => S.myVotes[s.k] === undefined);
const nextUnscored = (f) => {
  for (let i = f + 1; i < S.list.length; i++) if (S.myVotes[S.list[i].k] === undefined) return i;
  for (let i = 0; i <= f; i++) if (S.myVotes[S.list[i].k] === undefined) return i;
  return -1;
};

function render() {
  if (idx >= S.list.length) idx = S.list.length - 1;
  const t = S.list[idx], v = S.myVotes[t.k], done = Object.keys(S.myVotes).length, N = S.list.length;
  $("tnum").textContent = "Track " + (idx + 1) + " of " + N;
  $("tvote").textContent = v === undefined ? "Not scored" : "Your vote: " + LABEL[v];
  $("tcard").classList.toggle("unscored", v === undefined);
  $("tname").innerHTML = t.name + (t.added ? '<span class="tag">Added</span>' : "");
  $("tart").textContent = t.artist;
  $("tdur").textContent = mmss(t.dur);
  $("tyear").textContent = t.year || "";
  $("tbpm").textContent = t.bpm ? t.bpm + " bpm" : "";
  $("tera").textContent = eraLabel(t);
  $("ttune").textContent = tuneOf(t);
  $("pbar").style.width = (done / N * 100) + "%";
  $("pcount").textContent = done + " / " + N + " scored";
  $("pleft").textContent = (N - done) + " left";
  $("votes").querySelectorAll("button").forEach((b) => b.classList.toggle("on", +b.dataset.v === v));
  $("prev").disabled = idx === 0;
  $("next").disabled = idx === N - 1;
  $("next").textContent = (v === undefined ? "Skip" : "Next") + " →";
  $("clearv").disabled = v === undefined;
  $("jump").disabled = firstUnscored() < 0;
}

$("votes").querySelectorAll("button").forEach((b) => {
  b.onclick = () => {
    S.myVotes[S.list[idx].k] = +b.dataset.v;
    S.pool[S.me] = S.myVotes;
    persist();
    if (idx < S.list.length - 1) idx++;
    render();
  };
});
$("prev").onclick = () => { if (idx > 0) { idx--; render(); } };
$("next").onclick = () => { if (idx < S.list.length - 1) { idx++; render(); } };
$("jump").onclick = () => { const n = nextUnscored(idx); if (n >= 0) { idx = n; render(); } };
$("clearv").onclick = () => { delete S.myVotes[S.list[idx].k]; persist(); render(); };

/* ---------- boot ---------- */
$("ver").textContent = VERSION;
$("verNote").textContent = "Version " + VERSION + " — " + CHANGES[VERSION];

(async function () {
  try {
    const sn = localStorage.getItem("br_name"), ss = localStorage.getItem("br_secret");
    if (ss) { S.secret = ss; $("secretIn").value = ss; }
    if (sn) $("nameIn").value = sn;
  } catch (e) {}
  await pull();
  relist();
  const who = Object.keys(S.pool).filter((n) => Object.keys(S.pool[n] || {}).length);
  if (who.length) {
    toast("Votes on the sheet for: <b>" + who.map((n) => n + " (" + Object.keys(S.pool[n]).length + ")").join(", ") +
      "</b>. Pick your name to carry on.");
  }
})();
</script>
